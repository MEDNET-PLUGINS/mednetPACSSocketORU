# Configuration file path
pacs.socket.config=classpath:/usr/local/mednet/mednetFiles/config/propertiesFile/MednetPACSSocketORU.properties

# PACS identifier sent as path variable to ExternalPACS receive API
# Supported: CENTRICITY_GE, MedSynaptics, MedSynaptic, ImageBytes, Deeptek, Fuji, Radspa, PURUPACS
pacs.name=MedSynaptics

# Base receive URL (pacs.name is appended)
pacs.receiver.api.url=https://stage.mednetlabs.com/mednetExternalPACS/api/v1/report/receive

# MLLP listen port
pacs.oru.mllp.port=6161
