# PACS identifier sent as path variable to ExternalPACS receive API
# Supported: Centricity - GE, MedSynaptics, MedSynaptic, ImageBytes, Deeptek, Fuji, Radspa, Puru PACS
pacs.name=MedSynaptics

# Base receive URL (pacs.name is appended)
pacs.receiver.api.url=http://localhost:8091/mednetExternalPACS/api/v1/report/receive

# MLLP listen port
pacs.oru.mllp.port=6161
